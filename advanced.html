<!-- advanced.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Search</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="top-links">
      <a href="index.html">Google Search</a>
    </div>

    <div class="advanced-container">
      <form action="https://www.google.com/search">
        <label>All these words: <input type="text" name="as_q" /></label>
        <label>Exact phrase: <input type="text" name="as_epq" /></label>
        <label>Any of these words: <input type="text" name="as_oq" /></label>
        <label>None of these words: <input type="text" name="as_eq" /></label>
        <input type="submit" value="Advanced Search" class="blue-button" />
      </form>
    </div>
  </body>
</html>
